# Run the unit suite on every push and pull request. The suite is fully
# offline (synthetic ABIs + the committed ENS descriptors), so no secrets or
# API keys are needed here.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: review the shipped ENS descriptors (offline checks)
        run: |
          python scripts/review.py --no-lint --no-semverify \
            registry/ens/calldata-ETHRegistrarController.json \
            registry/ens/calldata-NameWrapper.json \
            registry/ens/calldata-BulkRenewal.json > /dev/null
